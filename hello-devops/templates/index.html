<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, Docker!</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 640px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .muted { color: #8b949e; font-size: 14px; }
    .count { font-size: 56px; font-weight: 700; color: #58a6ff; margin: 16px 0 4px; }
    code {
      background: #21262d;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 13px;
    }
    ul { line-height: 1.9; padding-left: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Hello, Docker!</h1>
    <p class="muted">这个页面由一个容器里的 Python 程序返回。</p>

    <div class="count">{{ count }}</div>
    <p class="muted">次访问（刷新一次 +1）。数字存在 <code>{{ data_file }}</code>。</p>

    <ul>
      <li>容器主机名：<code>{{ hostname }}</code></li>
      <li>试试：删掉容器再访问一次，看看这个数字会变成几？</li>
      <li>试试：用 <code>-v</code> 挂一个卷再删容器，数字还在吗？</li>
    </ul>
  </div>
</body>
</html>
