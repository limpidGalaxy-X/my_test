# docker compose 文件：把"一长串 docker run 参数"写成配置文件。
# 用法：docker compose up -d --build

services:
  web:
    build: .                 # 用当前目录的 Dockerfile 构建
    image: hello-devops:1.0  # 构建出来的镜像名字
    container_name: hello-web
    ports:
      - "8000:8000"          # 宿主机端口:容器端口
    volumes:
      # 把宿主机的 ./data 目录挂到容器的 /data
      # 效果：删掉容器重建，访问次数还在（数据存在宿主机上）
      - ./data:/data
    environment:
      - FLASK_DEBUG=1        # 打开调试模式（改代码自动重启，仅开发用）
    restart: unless-stopped
